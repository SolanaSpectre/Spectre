[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venum-standalone"
version = "0.1.0"
description = "Standalone Venum X growth and persona engine"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "requests-oauthlib>=1.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["venum_standalone*"]
